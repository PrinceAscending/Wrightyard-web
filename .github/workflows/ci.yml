name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  site:
    name: Site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SITE_URL: https://wrightyard.vercel.app
      DISCORD_CLIENT_ID: "1566784935342252032"
      DISCORD_CLIENT_SECRET: ci-placeholder
      DISCORD_TOKEN: ci-placeholder
      DISCORD_GUILD_ID: "1566778873985892442"
      OWNER_ID: "971329961313046578"
      ANNOUNCEMENTS_CHANNEL_ID: "1566786878416486500"
      AUTH_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef
      BOT_HEARTBEAT_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef
      MONGODB_URI: mongodb://127.0.0.1:27017/wrightyard
      MONGODB_DB: wrightyard

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
